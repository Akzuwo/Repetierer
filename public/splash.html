<!doctype html>

<html lang="de">

<head>
	<meta charset="utf-8">
	<title>Repetierer</title>
	<meta name="description" content="(:">
	<meta name="author" content="srpnt3, Jonas-Luetolf, Akzuwo">
	<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="container" class="startup-active splash-container">
	<div id="startup-splash">
		<svg class="startup-loader" viewBox="0 0 760 220" role="img" aria-label="Repetierer 7">
			<defs>
				<linearGradient gradientUnits="userSpaceOnUse" y2="0" x2="760" y1="150" x1="0" id="startup-gradient">
					<stop stop-color="#0f1113" />
					<stop stop-color="#3b82f6" />
					<stop stop-color="#0f1113" offset="1" />
					<animateTransform repeatCount="indefinite" dur="14s" values="0 380 75;-270 380 75;-270 380 75;-540 380 75;-540 380 75;-810 380 75;-810 380 75;-1080 380 75;-1080 380 75" type="rotate" attributeName="gradientTransform" />
				</linearGradient>
				<linearGradient gradientUnits="userSpaceOnUse" x1="-260" x2="-40" y1="0" y2="0" id="startup-natural-fill">
					<stop offset="0" stop-color="#ffffff" stop-opacity="1" />
					<stop offset="0.48" stop-color="#ffffff" stop-opacity="0.96" />
					<stop offset="0.78" stop-color="#f5f7fb" stop-opacity="0.62" />
					<stop offset="1" stop-color="#f5f7fb" stop-opacity="0" />
					<animate class="startup-fill-motion" attributeName="x1" begin="indefinite" dur="1.2s" from="-260" to="800" fill="freeze" />
					<animate class="startup-fill-motion" attributeName="x2" begin="indefinite" dur="1.2s" from="-40" to="1020" fill="freeze" />
				</linearGradient>
				<linearGradient gradientUnits="userSpaceOnUse" x1="-180" x2="-20" y1="0" y2="0" id="startup-line-reveal-gradient">
					<stop offset="0" stop-color="#ffffff" />
					<stop offset="0.55" stop-color="#ffffff" />
					<stop offset="0.82" stop-color="#ffffff" stop-opacity="0.5" />
					<stop offset="1" stop-color="#000000" />
					<animate class="startup-line-reveal-motion" attributeName="x1" begin="indefinite" dur="3.5s" from="-180" to="680" fill="freeze" />
					<animate class="startup-line-reveal-motion" attributeName="x2" begin="indefinite" dur="3.5s" from="-20" to="840" fill="freeze" />
				</linearGradient>
				<mask id="startup-line-reveal-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="220">
					<rect x="0" y="0" width="760" height="220" fill="url(#startup-line-reveal-gradient)" />
				</mask>
			</defs>
			<text class="startup-loader-word" x="380" y="110" dominant-baseline="middle" text-anchor="middle" mask="url(#startup-line-reveal-mask)">Repetierer</text>
			<text class="startup-loader-seven" x="600" y="110" dominant-baseline="middle" text-anchor="middle">7</text>
		</svg>
		<span class="startup-credit">by timolu</span>
	</div>
</div>
</body>

<script>
	require('./splash.js');
</script>

</html>
