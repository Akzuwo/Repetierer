<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repetierer · Manueller UI-Audit</title>
<style>
:root{font-family:system-ui,sans-serif;color:#202b3b;background:#edf1f5}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#fffefbf5;border-bottom:1px solid #ccd4df;padding:18px max(24px,calc((100vw - 1160px)/2));z-index:1;backdrop-filter:blur(10px)}h1{font-size:24px;margin:0 0 8px}header p{margin:4px 0 12px;color:#526177;font-size:14px}.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}button,.import{border:1px solid #c4cddd;border-radius:7px;background:white;padding:10px 14px;color:#25354d;font:inherit;font-size:14px;cursor:pointer}button.primary{background:#1749b3;color:white;border-color:#1749b3}input[type=search]{padding:11px;border:1px solid #c4cddd;border-radius:7px;min-width:220px;font:inherit}main{max-width:1160px;margin:28px auto;padding:0 20px}article{background:white;border:1px solid #d2dae5;border-radius:12px;margin:0 0 30px;padding:20px;scroll-margin-top:180px}article h2{font-size:19px;margin:0 0 8px;overflow-wrap:anywhere}article p{font:13px ui-monospace,monospace;color:#637187;overflow-wrap:anywhere}a{color:#1749b3}img{display:block;max-width:100%;height:auto;background:#070a10;border-radius:6px;border:1px solid #ccd4df;margin:18px auto}label{display:block;font-weight:650;margin:14px 0 8px}textarea{width:100%;padding:12px;border:1px solid #aab8cc;border-radius:6px;font:16px/1.5 system-ui;resize:vertical;min-height:110px}textarea:focus{outline:3px solid #b6d2ff;border-color:#1749b3}.save-state{display:block;color:#58715a;min-height:18px;margin-top:5px}#status{font-size:13px;color:#526177}#empty{display:none;padding:24px}article[hidden]{display:none}@media(max-width:600px){header{position:static;padding:16px}main{padding:0 10px}article{padding:12px}.tools>*{flex:1}h1{font-size:21px}}
</style>
<header><h1>Repetierer · UI-Audit</h1><p>AUDIT_COUNT Bilder · Bild öffnen zum Vergrößern. Kommentare bleiben im aktuellen Browser. Lade regelmäßig die Markdown-Datei als Sicherung herunter.</p><div class="tools"><button class="primary" id="export">Kommentare als Markdown herunterladen</button><label class="import" style="margin:0;font-weight:400" for="import">Markdown importieren</label><input id="import" type="file" accept=".md,text/markdown,text/plain" hidden><input id="search" type="search" placeholder="Bildname oder Kommentar suchen" aria-label="Bilder durchsuchen"><button id="filter" aria-pressed="false">Nur kommentierte</button><span id="status" role="status" aria-live="polite"></span></div></header>
<main><!-- AUDIT_CARDS --><p id="empty">Keine passenden Bilder.</p></main>
<script>
const cards=[...document.querySelectorAll('article')],key='repetierer-manual-audit-comments-v1';
let comments={},storage=true,onlyCommented=false;
try{comments=JSON.parse(localStorage.getItem(key)||'{}');if(!comments||typeof comments!=='object')comments={};}catch{storage=false;comments={};}
function status(){document.getElementById('status').textContent=`${cards.filter(c=>c.querySelector('textarea').value.trim()).length} / ${cards.length} kommentiert${storage?' · lokal gespeichert':' · Browserspeicher nicht verfügbar – bitte exportieren'}`;}
function filter(){const q=document.getElementById('search').value.toLowerCase();let count=0;for(const c of cards){c.hidden=(!(`${c.dataset.file} ${c.querySelector('textarea').value}`.toLowerCase().includes(q)))||(onlyCommented&&!c.querySelector('textarea').value.trim());if(!c.hidden)count++;}document.getElementById('empty').style.display=count?'none':'block';}
function save(){try{localStorage.setItem(key,JSON.stringify(comments));storage=true;}catch{storage=false;}status();}
for(const c of cards){const t=c.querySelector('textarea');t.value=typeof comments[c.dataset.file]==='string'?comments[c.dataset.file]:'';t.addEventListener('input',()=>{comments[c.dataset.file]=t.value;save();c.querySelector('.save-state').textContent=storage?'Gespeichert':'Bitte als Markdown sichern';if(onlyCommented||document.getElementById('search').value)filter();});}
document.getElementById('search').addEventListener('input',filter);document.getElementById('filter').onclick=e=>{onlyCommented=!onlyCommented;e.currentTarget.setAttribute('aria-pressed',String(onlyCommented));e.currentTarget.textContent=onlyCommented?'Alle Bilder anzeigen':'Nur kommentierte';filter();};
function markdown(){let s='# Repetierer – UI-Audit\n\nExport: '+new Date().toISOString()+'\n\n';for(const c of cards){const text=c.querySelector('textarea').value;if(!text.trim())continue;s+='## '+c.dataset.file+'\n\n<!-- audit-comment:'+c.dataset.file+' -->\n'+text+'\n<!-- /audit-comment -->\n\n';}return s;}
document.getElementById('export').onclick=()=>{const blob=new Blob([markdown()],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='repetierer-ui-audit-kommentare-'+new Date().toISOString().slice(0,10)+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
document.getElementById('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;const text=await file.text();let n=0;const known=new Set(cards.map(c=>c.dataset.file));for(const m of text.matchAll(/<!-- audit-comment:([^\r\n]+?) -->\r?\n([\s\S]*?)\r?\n<!-- \/audit-comment -->/g)){if(known.has(m[1])){const c=cards.find(c=>c.dataset.file===m[1]),t=c.querySelector('textarea');t.value=m[2];comments[m[1]]=m[2];n++;}}save();filter();document.getElementById('status').textContent+=` · ${n} Kommentare importiert`;e.target.value='';};
status();
</script></html>
