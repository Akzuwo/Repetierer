name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optionale Release Notes für den GitHub-Release (Markdown möglich)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate release notes
        id: release-notes
        run: node scripts/generate-release-notes.js
        env:
          RELEASE_NOTES_OVERRIDE: ${{ inputs.release_notes }}

      - name: Build and publish release
        run: npm run release:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release body
        run: gh release edit "${{ steps.release-notes.outputs.tag }}" --notes-file "${{ steps.release-notes.outputs.release_notes_path }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
