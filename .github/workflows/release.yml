name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repetierer-release
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate release notes from Buildnotes.json
        id: release-notes
        run: node scripts/generate-release-notes.js

      - name: Build Windows release without publishing
        run: npm run release:ci
        env:
          PUBLISH_MODE: never

      - name: Verify tag and publish release with assets
        run: node scripts/publish-release.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-notes.outputs.tag }}
